version: 2

models:
  - name: dim_customers
    description: One row per customer, reflecting their current attributes.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: dim_products
    description: One row per product, reflecting its current attributes.
    columns:
      - name: product_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null

  - name: fact_orders
    description: >
      One row per order (order grain), with order_items rolled up into
      item_count and total_amount.
    columns:
      - name: order_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to dim_customers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ["pending", "shipped", "delivered", "cancelled"]
      - name: total_amount
        description: Sum of quantity * unit_price across the order's line items.
